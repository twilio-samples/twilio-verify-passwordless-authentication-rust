[package]
name = "twilio-verify-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = [
    "form",
    "macros",
    "tokio",
    "tower-log",
] }
axum-macros = "0.5.1"
axum-template = { version = "3.0.0", features = ["handlebars"] }
axum_session = "0.20.1"
dotenvy = "0.15.7"
handlebars = "6.4.3"
rustlio = { path = "../rustlio" }
serde = { version = "1.0.228", features = ["derive"] }
stringcase = "1.0.0"
tokio = { version = "1.52.4", features = ["macros", "rt-multi-thread"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
